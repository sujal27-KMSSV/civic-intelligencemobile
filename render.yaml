# Render Blueprint — one-click deploy for Civic Intelligence.
# Django API (backend/) + optional FastAPI AI sidecar (ai_service/).
# See backend/.env.production.example for every variable.
services:
  - type: web
    name: civic-intelligence-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false # fill with your domain, e.g. api.example.com
      - key: DB_ENGINE
        value: postgresql
      - key: DB_NAME
        sync: false # from your managed Postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # https://admin on your domain
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false # https://<your-domain>
      # Point at the sidecar service below when you run it. Empty (default) =
      # rule-based only, exactly like v2. NOTE: Render's free 512 MB plan
      # cannot host torch, so leave this unset on the demo fleet.
      - key: AI_SERVICE_URL
        sync: false # https://civic-intelligence-ai.onrender.com
      - key: AI_SERVICE_TIMEOUT
        value: "4"
      # Genuine PostGIS only: free-tier Render Postgres has no PostGIS
      # extension, so keep GEOSPAT_ENABLED=0 here. See docs/postgis.md.
      - key: GEOSPAT_ENABLED
        value: "False"

  # Optional AI sidecar (ai_service/). Skip this service on free tier --
  # inference needs ~2 GB RAM. The API degrades to rule-based without it.
  - type: web
    name: civic-intelligence-ai
    runtime: docker
    rootDir: ai_service
    plan: standard # recommended; free is too small for torch
    healthCheckPath: /health
    envVars:
      - key: AI_MODEL_DIR
        value: /app/artifacts