# Render Blueprint — one-click deploy for Civic Intelligence API.
# See backend/.env.production.example for every variable.
services:
  - type: web
    name: civic-intelligence-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false # fill with your domain, e.g. api.example.com
      - key: DB_ENGINE
        value: postgresql
      - key: DB_NAME
        sync: false # from your managed Postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # https://admin on your domain
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false # https://<your-domain>